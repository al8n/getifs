name: Crates.io

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
  CARGO_TERM_COLOR: always

jobs:
  prepare-lock:
    name: Prepare Cargo.lock
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master on 2026-10-03
        with:
          toolchain: 1.99.0
      - name: Generate and validate lockfile
        run: |
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 >/dev/null
      - name: Upload lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: getifs-cargo-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify crate release
    needs: prepare-lock
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      lock_sha256: ${{ steps.lock.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag provenance
        if: ${{ github.event_name == 'push' && github.event.deleted == false && github.ref_type == 'tag' }}
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$RELEASE_TAG" != "v${version}" ]]; then
            printf 'Tag %s does not match package version %s\n' "$RELEASE_TAG" "$version" >&2
            exit 1
          fi

          release_commit=$(git rev-parse "${RELEASE_SHA}^{commit}")
          main_ref=refs/remotes/origin/main
          git rev-parse --verify "${main_ref}^{commit}" >/dev/null
          if ! git merge-base --is-ancestor "$release_commit" "$main_ref"; then
            printf 'Tagged commit %s is not an ancestor of origin/main\n' "$release_commit" >&2
            exit 1
          fi
          if [[ $(git rev-parse HEAD) != "$release_commit" ]]; then
            printf 'Checked-out commit does not match the tag event commit\n' >&2
            exit 1
          fi
      - name: Download lockfile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: getifs-cargo-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Record lockfile digest
        id: lock
        run: echo "sha256=$(sha256sum Cargo.lock | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master on 2026-10-03
        with:
          toolchain: 1.99.0
      - name: Verify the publishable archive
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/getifs-release-target
          EXPECTED_LOCK_SHA256: ${{ steps.lock.outputs.sha256 }}
          TMPDIR: ${{ runner.temp }}/getifs-release-tmp
        run: |
          mkdir -p "$TMPDIR"
          bash .github/scripts/verify-package.sh --existing-lock
          actual_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')
          if [[ "$actual_lock_sha256" != "$EXPECTED_LOCK_SHA256" ]]; then
            printf 'Package verification changed Cargo.lock\n' >&2
            exit 1
          fi

  publish:
    name: Publish crate
    if: ${{ github.event_name == 'push' && github.event.deleted == false && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
    needs: verify
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified lockfile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: getifs-cargo-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master on 2026-10-03
        with:
          toolchain: 1.99.0
      - name: Recheck release inputs
        env:
          EXPECTED_LOCK_SHA256: ${{ needs.verify.outputs.lock_sha256 }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! -f Cargo.lock ]]; then
            printf 'Verified Cargo.lock artifact is missing\n' >&2
            exit 1
          fi

          actual_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')
          if [[ -z "$EXPECTED_LOCK_SHA256" || "$actual_lock_sha256" != "$EXPECTED_LOCK_SHA256" ]]; then
            printf 'Downloaded Cargo.lock does not match the verified lockfile\n' >&2
            exit 1
          fi

          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$RELEASE_TAG" != "v${version}" ]]; then
            printf 'Tag %s does not match package version %s\n' "$RELEASE_TAG" "$version" >&2
            exit 1
          fi

          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          actual_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')
          if [[ "$actual_lock_sha256" != "$EXPECTED_LOCK_SHA256" ]]; then
            printf 'Release input validation changed Cargo.lock\n' >&2
            exit 1
          fi
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish getifs
        run: cargo publish --package getifs --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
