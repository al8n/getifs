name: coverage

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'COPYRIGHT'
      - 'LICENSE*'
      - '**.md'
      - '**.txt'
      - 'art'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'COPYRIGHT'
      - 'LICENSE*'
      - '**.md'
      - '**.txt'
      - 'art'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage-report:
    name: Generate Coverage for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install latest nightly
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master on 2026-10-03
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835 # cargo-llvm-cov on 2026-10-03
      - name: Run Coverage and Generate Report
        run: |
          mkdir -p "coverage/${{ matrix.os }}"
          cargo llvm-cov --all-features --doctests --cobertura --output-path "coverage/${{ matrix.os }}/cobertura.xml" -j 1
      - name: Upload Coverage Report as Artifact
        # Artifact uploads can hit transient GitHub artifact-service errors
        # (the Windows runner flaked once at this step while the other four
        # jobs uploaded fine). A flaky upload shouldn't redden the whole
        # coverage run — the generation step above is the real signal, and
        # upload-codecov merges whatever artifacts actually made it.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: coverage/${{ matrix.os }}/cobertura.xml

  # Coverage for the pure-Rust musl target (x86_64-unknown-linux-musl).
  # getifs uses rustix's `linux_raw` backend on Linux, so the musl build
  # links no libc — this exercises that pure-Rust static path. The musl
  # test binary is statically linked and runs natively on the ubuntu
  # runner, so no emulator is needed: just the musl linker (`musl-tools`,
  # which also provides the `musl-gcc` that the `alloca` dev-dependency's
  # build script needs) and the rustup target. Doctests are skipped
  # here because the nightly host matrix covers them; this job runs only
  # library and integration tests, matching the FreeBSD job.
  coverage-linux-musl:
    name: Generate Coverage for linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install latest nightly + musl target
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master on 2026-10-03
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-musl
          components: llvm-tools-preview
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835 # cargo-llvm-cov on 2026-10-03
      - name: Run Coverage and Generate Report
        run: |
          mkdir -p coverage/linux-musl
          cargo llvm-cov --all-features --target x86_64-unknown-linux-musl --lib --tests --cobertura --output-path coverage/linux-musl/cobertura.xml -j 1
      - name: Upload Coverage Report as Artifact
        if: hashFiles('coverage/linux-musl/cobertura.xml') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: linux-musl
          path: coverage/linux-musl/cobertura.xml

  # BSD coverage: only FreeBSD has a viable coverage job. NetBSD,
  # OpenBSD, and DragonFly all ship rust packages built without the
  # `profiler_builtins` crate, which cargo-llvm-cov requires through
  # rustc's source-based coverage instrumentation. Any
  # `-Cinstrument-coverage` build fails with `error[E0463]: can't
  # find crate for profiler_builtins`. rustup doesn't support those
  # host triples, so we can't swap in a profiler-enabled toolchain
  # inside the vmactions VM. The `test-{netbsd,openbsd,dragonflybsd}`
  # jobs in `ci.yml` exercise those code paths at runtime; coverage
  # just isn't measurable.
  #
  # FreeBSD uses rustup, which gives us a profiler-enabled toolchain.
  # This job runs only library and integration tests; doctests are
  # covered by the nightly host matrix.
  coverage-freebsd:
    name: Generate Coverage for freebsd
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Generate coverage on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          copyback: true
          prepare: |
            pkg install -y curl
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile=minimal --default-toolchain stable
            . $HOME/.cargo/env
            rustup component add llvm-tools-preview
            cargo install cargo-llvm-cov --locked
          run: |
            . $HOME/.cargo/env
            mkdir -p coverage/freebsd
            # Doctests are covered by the nightly host matrix; this
            # job runs only library and integration tests.
            cargo llvm-cov --all-features --lib --tests --cobertura --output-path coverage/freebsd/cobertura.xml -j 1

      - name: Upload Coverage Report as Artifact
        if: hashFiles('coverage/freebsd/cobertura.xml') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: freebsd
          path: coverage/freebsd/cobertura.xml

  # NetBSD coverage isn't viable: the pkgsrc-shipped `rust` package is
  # built without `profiler_builtins`, which cargo-llvm-cov needs for
  # rustc's `-Cinstrument-coverage` instrumentation. The coverage
  # compile fails with `error[E0463]: can't find crate for
  # profiler_builtins / the compiler may have been built without the
  # profiler runtime`. rustup doesn't support NetBSD as a host triple,
  # so there's no way to swap in a profiler-enabled toolchain inside
  # the vmactions VM. The runtime test pass in `ci.yml`'s `test-netbsd`
  # job exercises the netbsdlike code path; coverage just isn't
  # measurable here.

  # OpenBSD coverage isn't viable for the same reason as NetBSD and
  # DragonFly: the pkg-shipped `rust` package is built without
  # `profiler_builtins`, so `-Cinstrument-coverage` fails with
  # `error[E0463]: can't find crate for profiler_builtins`. rustup
  # doesn't support OpenBSD as a host triple. The runtime test pass
  # in `ci.yml`'s `test-openbsd` job exercises the netbsdlike code
  # path with OpenBSD-specific quirks (`rtm_priority`,
  # `RTAX_SRC` / `RTAX_SRCMASK`, etc.); coverage just isn't
  # measurable here.

  # DragonFly coverage isn't viable for the same reason as NetBSD:
  # the pkg-shipped `rust` package is built without
  # `profiler_builtins`, so `-Cinstrument-coverage` fails with
  # `error[E0463]: can't find crate for profiler_builtins`. rustup
  # doesn't support DragonFly as a host triple. The runtime test
  # pass in `ci.yml`'s `test-dragonflybsd` job exercises the
  # freebsdlike-with-DragonFly-quirks code path.

  upload-codecov:
    # `needs:` waits on every coverage producer. The
    # `if: always() && !cancelled()` predicate opts the upload step
    # into running even if a producer fails or is skipped — without
    # it, GitHub Actions would short-circuit the whole upload on any
    # missing dependency, and a single VM hiccup on FreeBSD would
    # silently kill the entire coverage signal. The
    # `download-artifact@v6` step picks up whatever artifacts were
    # actually produced; a missing FreeBSD report just means the
    # codecov.io merge runs without that platform's data for that
    # commit.
    needs: [coverage-report, coverage-freebsd, coverage-linux-musl]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download all coverage reports
        uses: actions/download-artifact@v8
        with:
          path: reports/
      - name: List contents of the reports directory
        run: ls -a reports || true
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          directory: reports
          fail_ci_if_error: false
          slug: ${{ github.repository }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
