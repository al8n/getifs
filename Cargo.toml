[package]
name = "getifs"
version = "0.7.0"
edition = "2021"
repository = "https://github.com/al8n/getifs"
documentation = "https://docs.rs/getifs"
description = "Cross-platform enumeration of network interfaces and their MTU, gateway, multicast, and local/private/public IP addresses."
license = "MIT OR Apache-2.0"
rust-version = "1.85.0"
keywords = ["getifaddrs", "network-interface", "local-ip-address", "gateway", "mtu"]
categories = ["network-programming"]
# The Android CI harness, local design docs, and fuzz workspace are not part of the
# published crate.
exclude = ["/ci", "/docs", "/fuzz"]

[[bench]]
path = "benches/interfaces.rs"
name = "interfaces"
harness = false

[[bench]]
path = "benches/local_ip_address.rs"
name = "local_ip_address"
harness = false

[[bench]]
path = "benches/gateway.rs"
name = "gateway"
harness = false

[[bench]]
path = "benches/route.rs"
name = "route"
harness = false

[features]
default = []

[dependencies]
bitflags = "2"
cfg-if = "1"
hardware-address = "1"
iprobe = "1"
ipnet = "2"
iprfc = "1"
paste = { package = "pastey", version = "0.2.3" }
smol_str = "0.3.2"
smallvec-wrapper = "0.4"

[target.'cfg(all(not(windows), not(any(target_os = "android", target_os = "linux"))))'.dependencies]
libc = "0.2"
# `time` works around rustix 1.1.5's `timespec` gate, which breaks iprobe's `net`-only build (bytecodealliance/rustix#1689); getifs does not use it.
rustix = { version = "1.1", features = ["time"] }

[target.'cfg(all(any(target_os = "android", target_os = "linux")))'.dependencies]
# `param` provides the page size that sizes the address-dump receive buffer.
# `time` works around rustix 1.1.5's `timespec` gate, which breaks iprobe's `net`-only build (bytecodealliance/rustix#1689); getifs does not use it.
rustix = { version = "1.1", features = ["net", "param", "time"] }
linux-raw-sys = { version = "0.12", features = ["if_arp", "net", "netlink"] }

[target.'cfg(all(any(target_os = "android", target_os = "linux")))'.dev-dependencies]
rustix = { version = "1.1", features = ["net", "process"] }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_NetworkManagement", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }
widestring = "1"

[dev-dependencies]
criterion = "=0.8.2"
network-interface = "2"
local-ip-address = "0.6"
which = "8"
scopeguard = "1"


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(apple)',
  'cfg(bsd_like)',
  'cfg(freebsdlike)',
  'cfg(netbsdlike)',
  'cfg(linux_like)',
  'cfg(fuzzing)',
] }
